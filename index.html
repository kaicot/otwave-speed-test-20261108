<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>OTWAVE 접속 속도 시험</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',sans-serif;color:#183932;background:#f8f8f2;line-height:1.7}header,main{width:min(1100px,calc(100% - 40px));margin:auto}header{padding:24px 0;font-weight:bold;letter-spacing:.05em}.notice{background:#1b3d32;color:white;padding:8px 20px;text-align:center;font-size:13px}main{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:60px 0}h1{font-size:clamp(32px,4vw,52px);line-height:1.4;word-break:keep-all}p{max-width:38em}img{width:100%;height:auto;display:block}.caption{font-size:12px;color:#4e665d}@media(max-width:650px){main{grid-template-columns:1fr;gap:20px;padding:24px 0}}
  </style>
</head>
<body>
  <div class="notice">OTWAVE · 접속 속도 비교를 위한 임시 시험 페이지</div>
  <header>OTWAVE</header>
  <main>
    <div><h1>당신의 하루가,<br>작업치료의 시작입니다.</h1><p>같은 글과 이미지를 두 호스팅에 배치해 화면 표시 속도를 비교합니다.</p></div>
    <div><img src="ep01-still.jpg" width="1920" height="1080" alt="아이가 외투 지퍼를 올리는 영상 장면"><p class="caption">EP01 영상의 한 장면 · AI 생성 영상</p></div>
  </main>
</body>
</html>
